spring.application.name=ecommerce-product-service

server.port=8081

# =========================================================
# MONGODB ATLAS CONFIGURATION
# =========================================================
# Credentials hidden for GitHub safety
spring.data.mongodb.uri=mongodb+srv://${MONGO_USER}:${MONGO_PASSWORD}@mongonilesh1.th5x6rk.mongodb.net/AmazonProducts?retryWrites=true&w=majority&appName=MongoNilesh1
spring.data.mongodb.database=AmazonProducts

# =========================================================
# REDIS CONFIGURATION (Upstash)
# =========================================================
# Host and Password hidden for GitHub safety
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# =========================================================
# KAFKA CONFIGURATION
# =========================================================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.group-id=product-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# =========================================================
# EUREKA DISCOVERY CONFIGURATION
# =========================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================================================
# ACTUATOR CONFIGURATION
# =========================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# =========================================================
# DISTRIBUTED TRACING & ZIPKIN
# =========================================================
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# =========================================================
# CONSOLE LOGGING PATTERN (traceId/spanId visible per line)
# =========================================================
logging.pattern.level=%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]

# ---------------- OPTIONAL LOGS (cache hit/miss visibility) ----------------
logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis=DEBUG
