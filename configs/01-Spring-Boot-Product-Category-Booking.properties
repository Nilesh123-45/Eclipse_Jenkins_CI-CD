spring.application.name=01-Spring-Boot-Product-Category-Booking
server.port=8095

# ---------------- MySQL ----------------
spring.datasource.url=jdbc:mysql://localhost:3306/microservices_db
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------------- Eureka Client Configuration ----------------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# ---------------- Kafka Consumer Configuration ----------------
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ---------------- Resilience4j Circuit Breaker ----------------
resilience4j.circuitbreaker.instances.myPaymentBouncer.sliding-window-size=10
resilience4j.circuitbreaker.instances.myPaymentBouncer.minimum-number-of-calls=6
resilience4j.circuitbreaker.instances.myPaymentBouncer.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.myPaymentBouncer.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.myPaymentBouncer.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.myPaymentBouncer.automaticTransitionFromOpenToHalfOpenEnabled=true

# ---------------- Distributed Tracing & Zipkin ----------------
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# ---------------- OpenFeign Tracing ----------------
spring.cloud.openfeign.micrometer.enabled=true

# ---------------- Console Logging Pattern ----------------
logging.pattern.level=%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]

