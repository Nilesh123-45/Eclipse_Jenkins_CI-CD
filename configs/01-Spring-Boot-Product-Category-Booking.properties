# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Force Eureka to use localhost and show the port in the instance ID
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# Kafka Consumer Configuration
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


resilience4j.circuitbreaker.instances.myPaymentBouncer.sliding-window-size=10
resilience4j.circuitbreaker.instances.myPaymentBouncer.minimum-number-of-calls=6
resilience4j.circuitbreaker.instances.myPaymentBouncer.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.myPaymentBouncer.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.myPaymentBouncer.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.myPaymentBouncer.automaticTransitionFromOpenToHalfOpenEnabled=true
