spring.application.name=ecommerce-cart-service

server.port=8082

# =========================================================
# REDIS CONFIGURATION (local Docker instance)
# =========================================================

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s


# =========================================================
# EUREKA DISCOVERY CONFIGURATION
# =========================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true



# =========================================================
# ACTUATOR CONFIGURATION
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always


# =========================================================
# DISTRIBUTED TRACING & ZIPKIN
# =========================================================

management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans


# =========================================================
# CONSOLE LOGGING PATTERN (traceId/spanId visible per line)
# =========================================================

logging.pattern.level=%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]


# =========================================================
# FEIGN CLIENT LOGGING (see the outbound call to Product Service)
# =========================================================

logging.level.org.cart.client=DEBUG
